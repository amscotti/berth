name: GPUI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: gpui-${{ github.ref }}
  cancel-in-progress: true

env:
  # Signing is intentionally disabled: no codesign, no notarization, no
  # keychain prompt. See docs/RELEASE.md.
  BERTH_SIGN: "0"
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-14
          - name: linux-x86_64
            os: ubuntu-24.04
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc g++ clang libfontconfig-dev libfreetype-dev \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libx11-xcb-dev libssl-dev libzstd-dev libasound2-dev \
            libvulkan-dev

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ runner.os }}-gpui-${{ hashFiles('Cargo.lock') }}

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Build
        run: cargo build --workspace --locked

      - name: Tests
        run: cargo test --workspace --locked

      - name: Line rule
        run: ./tools/lines.py

  screenshots:
    name: headless screenshots (macOS)
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: macos-gpui-${{ hashFiles('Cargo.lock') }}

      - name: Render the shell
        run: cargo run -p berth-app --example screenshots

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: berth-shell-screenshots
          path: docs/ui/*.png
          if-no-files-found: error

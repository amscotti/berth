[workspace]
resolver = "2"
members = [
    "crates/berth-app",
    "crates/berth-commands",
    "crates/berth-core",
    "crates/berth-engine",
    "crates/berth-ui",
]
default-members = ["crates/berth-app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/amscotti/berth"

[workspace.dependencies]
# One Zed commit for gpui and every gpui_* crate. See docs/GPUI-VERSION.md.
gpui = { git = "https://github.com/zed-industries/zed", rev = "db43f05e398036f08e544c03cbc068216c7a0aaa" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "db43f05e398036f08e544c03cbc068216c7a0aaa" }

anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tracing = "0.1"
libc = "0.2"

berth-commands = { path = "crates/berth-commands" }
berth-core = { path = "crates/berth-core" }
berth-engine = { path = "crates/berth-engine" }
berth-ui = { path = "crates/berth-ui" }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1

[package]
name = "berth-app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "berth: a native container monitor"

[features]
# Test-only local control socket; never enabled in release artifacts.
test-driver = []

[lib]
name = "berth_app"
path = "src/lib.rs"

[[bin]]
name = "berth"
path = "src/main.rs"

[dependencies]
gpui = { workspace = true }
berth-commands = { workspace = true }
berth-core = { workspace = true }
berth-engine = { workspace = true }
berth-ui = { workspace = true }
anyhow = { workspace = true }
dirs = "6"
sysinfo = "0.31"
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
gpui_platform = { workspace = true, features = ["font-kit"] }
tray-icon = "0.26"

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
gpui_platform = { workspace = true, features = ["wayland", "x11"] }

[target.'cfg(target_os = "windows")'.dependencies]
gpui_platform = { workspace = true }

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
gpui_platform = { workspace = true, features = ["test-support"] }
image = "0.25"

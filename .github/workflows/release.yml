name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: write

env:
  BERTH_SIGN: "0"
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  verify:
    name: verify ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc g++ clang libfontconfig-dev libfreetype-dev \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libx11-xcb-dev libssl-dev libzstd-dev libasound2-dev \
            libvulkan-dev

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: release-verify-${{ hashFiles('Cargo.lock') }}

      - name: Tag matches the workspace version
        run: |
          VERSION="${RELEASE_TAG#v}"
          CARGO_VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          test "$VERSION" = "$CARGO_VERSION" || {
            echo "tag $RELEASE_TAG does not match Cargo.toml version $CARGO_VERSION" >&2
            exit 1
          }

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --workspace --locked

      - name: Line rule
        run: ./tools/lines.py

  macos:
    name: macOS unsigned app
    needs: verify
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: release-macos-${{ hashFiles('Cargo.lock') }}

      - name: Build and package
        run: |
          BERTH_VERSION="${RELEASE_TAG#v}" sh scripts/package-macos.sh
          plutil -lint target/Berth.app/Contents/Info.plist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: berth-macos
          path: target/pkg/*.zip
          if-no-files-found: error

  linux:
    name: Linux tarball
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc g++ clang libfontconfig-dev libfreetype-dev \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libx11-xcb-dev libssl-dev libzstd-dev libasound2-dev \
            libvulkan-dev

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: release-linux-${{ hashFiles('Cargo.lock') }}

      - name: Build and package
        run: |
          cargo build --release -p berth-app --locked
          BERTH_VERSION="${RELEASE_TAG#v}" sh scripts/package-linux.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: berth-linux
          path: target/pkg/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [macos, linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Checksums
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: berth ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: artifacts/*
          body: |
            berth ${{ env.RELEASE_TAG }}.

            The macOS bundle is **unsigned**: there is no Developer ID yet, so
            Gatekeeper will warn on first launch. This is a local/private
            release, not a notarized App Store build.

            Artifacts:
            - macOS arm64 `.app` zip
            - Linux x86_64 tarball (binary, `.desktop`, icon, LICENSE, README)
            - `SHA256SUMS`
